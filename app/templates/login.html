{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="login-wrap">
  <div style="text-align:center; margin-bottom:1.25rem;">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="La Juanita Químicos" style="max-width:260px; width:100%; height:auto;">
  </div>
  <div class="card">
    <div class="card-header">
      <div class="card-header-titulo">
        <div>
          <h1>Iniciar sesión</h1>
          <p class="subtitulo">Sistema de control de inventario</p>
        </div>
      </div>
    </div>
    <form method="post">
      <label for="username">{{ icon('user', 14) }} Usuario</label>
      <input type="text" id="username" name="username" autofocus required placeholder="Ej. almacen1">

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required placeholder="••••••••">

      <button type="submit">{{ icon('log-out', 16) }} Ingresar</button>
    </form>
  </div>
</div>
{% endblock %}
